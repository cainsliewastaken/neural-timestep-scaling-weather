# Misc settings for a full training run (non-debug)
save_checkpoint: true
log_frequency: 0.1
log_every: null # alternatively, log every n steps
seed: 12345
enable_amp: true
amp_dtype: fp16 # one of: fp16, bf16
clip_grad_norm: 0.
compile: false
finetune_from: null # use to specify path to a checkpoint you want to finetune from
branch_from: null # use to specify path to a checkpoint you want to branch from
# If true, ignore branch_from/finetune_from and load the highest checkpoints/ckpt*_iterN.tar
# (job-chain resume after walltime). Default false.
load_highest_checkpoint: false
# Save a checkpoint (no validation) every N optimizer iterations, in addition to the
# log_every validate+checkpoint; null = only at log_every. Limits work lost at walltime.
checkpoint_every: null
temporal_context_window: 1
num_rollout_steps: 1
# recompute each rollout step in backward (saves activation memory for long rollouts)
rollout_activation_checkpointing: false
